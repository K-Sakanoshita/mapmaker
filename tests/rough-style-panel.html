<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../css/basemenu.css">
<style>#basemenu{position:relative;width:300px;height:600px}#mapid{position:absolute;left:310px;top:0;width:100px;height:100px}</style>
<div id="editbar"><section id="basemenu"><div class="container-fluid">
<div id="controlMenu"><button type="button">Existing controls</button></div>
<section id="roughControls"><div class="d-flex justify-content-between align-items-center">
<label id="roughSettingsButton" for="rough_fill_style">手書き風</label>
<button type="button" id="roughDetailsButton" disabled aria-haspopup="dialog" aria-expanded="false" onclick="RoughStylePanel.open()">詳細</button>
<input id="rough_enabled" type="checkbox" hidden><select id="rough_fill_style" aria-labelledby="roughSettingsButton" onchange="RoughStylePanel.selectFill()"><option value="none" selected>なし</option><option value="solid">Solid</option><option value="hachure">Hachure</option></select></div>
<div id="roughParameters" class="d-none">
<label for="roughness">粗さ</label><output id="roughness_value">1.0</output><input id="roughness" class="form-range" type="range" min="0" max="10" step="0.1" value="1" oninput="mapMaker.rough_change(1000)" disabled>
<label for="bowing">ゆがみ</label><output id="bowing_value">1.0</output><input id="bowing" class="form-range" type="range" min="0" max="10" step="0.1" value="1" oninput="mapMaker.rough_change(1000)" disabled>

</div></section><div id="saveMap"><button type="button">Save</button></div></div></section></div>
<div id="mapid"></div><pre id="result">PENDING</pre>
<script>const glot={get:key=>({rough_style:'手書き風',button_ok:'OK'}[key]||key)},map={getContainer:()=>document.querySelector('#mapid'),closePopup(){}};</script>
<script src="../lib/ui/line-width-panel.js"></script><script src="../lib/ui/rough-style-panel.js"></script><script src="../mapmaker.js"></script>
<script>
try {
 const checks=[];const check=(name,ok)=>{if(!ok)throw Error(name);checks.push(name)};
 mapMaker.customMode=true;let updates=0;
 mapMaker.queueExportPreview=()=>{updates++;mapMaker.setRoughPreviewLock(mapMaker.rough_options().enabled)};
 mapMaker.clearRoughPreview=()=>mapMaker.setRoughPreviewLock(false);
 const menu=document.querySelector('#basemenu'), toggle=document.querySelector('#rough_enabled'), home=document.querySelector('#roughControls'), anchor=document.querySelector('#roughSettingsButton');
 const parameters=document.querySelector('#roughParameters'),fill=document.querySelector('#rough_fill_style'),details=document.querySelector('#roughDetailsButton');
 const choose=value=>{fill.value=value;fill.dispatchEvent(new Event('change',{bubbles:true}))};
 check('None initially hides parameters',parameters.classList.contains('d-none') && details.disabled);
 choose('hachure');
 check('selection opens adjustment dialog',toggle.checked && mapMaker.rough_options().fillStyle==='hachure' && !parameters.classList.contains('d-none') && parameters.parentNode===RoughStylePanel.panel);
 const rect=RoughStylePanel.panel.getBoundingClientRect();check('dialog fits viewport',rect.left>=0 && rect.right<=innerWidth && rect.top>=0 && rect.bottom<=innerHeight);
 check('parameters leave scrollable settings panel',!home.contains(parameters));
 check('editing remains available',!document.querySelector('#controlMenu button').disabled && !document.querySelector('#roughness').disabled);
 document.querySelector('#roughness').value='2.4';document.querySelector('#roughness').dispatchEvent(new Event('input',{bubbles:true}));
 check('live controls update values',mapMaker.rough_options().roughness===2.4 && document.querySelector('#roughness_value').value==='2.4');
 const currentPanel=RoughStylePanel.panel;choose('solid');check('changing fill keeps dialog open',RoughStylePanel.panel===currentPanel && mapMaker.rough_options().fillStyle==='solid');
 document.querySelector('#roughStylePanel .btn-close').click();check('close preserves style and hides sliders',toggle.checked && mapMaker.rough_options().roughness===2.4 && !RoughStylePanel.panel && parameters.parentNode===home && parameters.classList.contains('d-none'));
 const beforeReopen=updates;details.click();check('details reopens without changing fill or redrawing',!!RoughStylePanel.panel && fill.value==='solid' && mapMaker.rough_options().roughness===2.4 && updates===beforeReopen && details.getAttribute('aria-expanded')==='true');
 document.querySelector('#roughStylePanel .btn-close').click();
 choose('hachure');check('selection reopens dialog',!!RoughStylePanel.panel);
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape closes with focus on details',!RoughStylePanel.panel && document.activeElement===details && details.getAttribute('aria-expanded')==='false');
 choose('solid');
 choose('none');check('None hides parameters and restores regular map',!toggle.checked && parameters.classList.contains('d-none') && !document.querySelector('#mapid').inert);
 check('fill select stays enabled and details is disabled for None',!fill.disabled && details.disabled);
 details.click();check('None cannot open details',!RoughStylePanel.panel);
 choose('hachure');check('re-enable retains slider values',!!RoughStylePanel.panel && !parameters.classList.contains('d-none') && mapMaker.rough_options().roughness===2.4);
 check('updates reached preview',updates>=4);
 document.querySelector('#result').textContent='PASS '+JSON.stringify(checks);
} catch(error){document.querySelector('#result').textContent='FAIL '+error.stack;}
</script>
