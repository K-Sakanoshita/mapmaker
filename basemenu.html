<div class="container-fluid text-center m-0 p-1">
    <div class="editor-heading">
    <h2 glot-model="editor_heading">地図の編集</h2>
    <div class="basemenu-window-controls btn-group" role="group">
        <button type="button" id="basemenuMinimize" class="btn btn-light basemenu-window-button" aria-label="最小化" aria-controls="customMap">
            <i class="fas fa-minus" aria-hidden="true"></i>
        </button>
        <button type="button" id="basemenuResize" class="btn btn-light basemenu-window-button basemenu-resize" aria-label="拡大" aria-controls="customMap" aria-expanded="false">
            <i class="far fa-window-maximize" aria-hidden="true"></i>
        </button>
    </div>

    </div>

    <div class="row g-0" id="makeMap">
        <div class="col p-1 m-0">
            <div class="make-map-action">
            <button class="btn btn-primary w-100" aria-describedby="morezoom makeMapZoomHint" disabled onclick="mapMaker.make(Basic.getdate())">
                <i class="fas fa-map me-2"></i><span glot-model="makemap" class="ms-2"></span>
            </button>
            </div>
            <div class="btn-group position-view-toggle" role="group">
                <button type="button" id="position2D" class="btn btn-outline-primary" onclick="mapMaker.positionView(false)">2D</button>
                <button type="button" id="position3D" class="btn btn-outline-primary" onclick="mapMaker.positionView(true)">3D</button>
            </div>
            <small id="makeMapZoomHint" class="make-map-zoom-hint mt-2" role="status" glot-model="make_map_zoom_hint">拡大するとマップを作れます。</small>
            <small id="birdseyeGesture" class="d-none d-lg-block text-muted mt-2" glot-model="birdseye_note">右ボタンまたはCtrl＋ドラッグで回転・傾斜。</small>
        </div>
    </div>

    <div class="row gx-0 mt-0" id="saveMap">
        <div class="col-4 p-1 m-0 save-reset">
            <button type="button" class="btn btn-light w-100" onclick="mapMaker.clearAll()" aria-label="再選択">
                <i class="fas fa-vector-square me-1" aria-hidden="true"></i><span glot-model="save_reset_label">再選択</span>
            </button>
        </div>
        <div class="col-8 p-1 m-0 dropdown save-download">
            <button type="button" class="btn btn-success dropdown-toggle w-100" id="saveDownloadMenu" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                <i class="fas fa-file-download me-1" aria-hidden="true"></i><span glot-model="save_menu">保存</span>
            </button>
            <ul id="exportSaveMenu" class="dropdown-menu dropdown-menu-end export-save-menu" aria-labelledby="saveDownloadMenu">
                <li class="export-save-settings">
                    <label for="exportPaperSize" glot-model="select_size">用紙サイズ</label>
                    <select id="exportPaperSize" class="form-select form-select-sm">
                        <option value="" glot-model="paper_full_view">画面全体</option>
                        <option value="A4" glot-model="area_A4">A4縦</option>
                        <option value="A4_landscape" glot-model="area_A4_landscape">A4横</option>
                        <option value="A3" glot-model="area_A3">A3縦</option>
                        <option value="A3_landscape" glot-model="area_A3_landscape">A3横</option>
                    </select>
                    <label for="exportQuality" glot-model="export_quality">PNGの精細さ</label>
                    <select id="exportQuality" class="form-select form-select-sm" aria-describedby="exportQualityNote">
                        <option value="150">標準</option>
                        <option value="300" selected>高精細</option>
                        <option value="600">最高精細</option>
                    </select>
                    <div class="export-pixel-size" role="status"><span glot-model="export_pixels">出力サイズ</span>：<output id="exportPixelSize"></output></div>
                    <small id="exportQualityNote" class="d-none text-muted" glot-model="export_quality_note">保存に時間がかかる場合があります。</small>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li class="export-save-prompt" glot-model="save_format_prompt">形式を選んで保存</li>
                <li class="export-save-action"><button type="button" class="btn btn-success" onclick="mapMaker.save('png');"><i class="fas fa-image" aria-hidden="true"></i><span glot-model="save_png">PNG画像を保存</span></button></li>
                <li class="export-save-action"><button type="button" class="btn btn-outline-success" onclick="mapMaker.save('svg');"><i class="fas fa-file-code" aria-hidden="true"></i><span glot-model="save_svg">SVG画像を保存（編集可能）</span></button></li>
                <li class="px-3 py-1"><button type="button" class="btn btn-link btn-sm text-secondary p-0 text-start export-metadata" onclick="mapMaker.save('json');" glot-model="save_metadata">メタ情報をダウンロード（JSON）</button></li>
            </ul>
        </div>
    </div>

    <div id="mobileSheetHeader" class="mobile-sheet-header">
        <button type="button" id="mobileSheetHandle" class="mobile-sheet-handle" aria-controls="customMap modal_select" aria-expanded="false">
            <span class="mobile-sheet-grip" aria-hidden="true"></span>
        </button>
        <div class="mobile-sheet-window-controls btn-group" role="group">
            <button type="button" id="mobileSheetClose" class="btn btn-light mobile-sheet-window-button" aria-label="最小化"><i class="fas fa-minus" aria-hidden="true"></i></button>
            <button type="button" id="mobileSheetExpand" class="btn btn-light mobile-sheet-window-button" aria-label="拡大"><i class="far fa-window-maximize" aria-hidden="true"></i></button>
        </div>
    </div>

    <div class="row row-cols-2 gy-0 gx-0 mt-2" id="controlMenu">
        <div class="col-6 p-1 m-0" id="editMenu">
            <button class="btn btn-light ps-0 pe-0 dropdown-toggle w-100" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-map-marker"></i>
                <span class="menu-button-label" glot-model="add_icon"></span>
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton" id="menu_list"></div>
        </div>

        <div class="col-6 p-1 m-0" id="colorMenu">
            <button type="button" id="mobileStylesTab" class="btn btn-light w-100" aria-controls="customMap" aria-expanded="false"><i class="fas fa-sliders-h" aria-hidden="true"></i><span glot-model="sheet_adjust">調整</span></button>
            <button class="btn btn-light ps-0 pe-0 dropdown-toggle w-100" id="ColorSelect" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-palette"></i>
                <span class="menu-button-label" glot-model="select_color"></span>
            </button>
            <div class="dropdown-menu" aria-labelledby="ColorSelect">
                <span class="dropdown-item btn ps-1 me-1" onclick="LayerCont.setStyle('color')">
                    <span class="palette-preview" data-palette="color" aria-hidden="true"></span>
                    <span glot-model="color_palette"></span></span>
                <span class="dropdown-item btn ps-1 me-1" onclick="LayerCont.setStyle('mono')">
                    <span class="palette-preview" data-palette="mono" aria-hidden="true"></span>
                    <span glot-model="mono_palette"></span></span>
                <span class="dropdown-item btn ps-1 me-1" onclick="LayerCont.setStyle('coloring')">
                    <span class="palette-preview" data-palette="coloring" aria-hidden="true"></span>
                    <span glot-model="coloring_palette"></span></span>
            </div>
        </div>
        <div class="col-6 p-1 m-0 mobile-palette-tab" id="mobilePaletteTab"></div>
    </div>

<div id="modal_select" class="icon-select-panel d-none" aria-label="施設選択">
    <div class="icon-select-layout">
        <div class="icon-select-content">
            <div class="icon-select-scroll">
            <div class="icon-select-toolbar p-2">
                <div class="icon-select-fields">
                    <div>
                        <select class="form-control" id="modal_select_category">
                            <option value="-">---</option>
                        </select>
                    </div>
                    <div>
                        <input type="search" class="form-control"
                            id="modal_select_keyword">
                    </div>
                    <div class="icon-name-options d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <input type="checkbox" id="modal_select_facility">
                            <label for="modal_select_facility" id="modal_select_facilityname"></label>
                        </div>
                    </div>
                    <div class="icon-size-options">
                        <label for="modal_select_size_preset" glot-model="icon_text_size"></label>
                        <select class="form-select" id="modal_select_size_preset">
                            <option value="12" glot-model="marker_size_small"></option>
                            <option value="14" glot-model="marker_size_standard"></option>
                            <option value="18" glot-model="marker_size_large"></option>
                            <option value="custom" glot-model="icon_size_custom"></option>
                        </select>
                        <div class="icon-size-preview" role="img" id="modal_select_size_preview">
                            <img id="modal_select_preview_icon" alt="">
                            <span class="icon" id="modal_select_preview_name"></span>
                        </div>
                        <details id="modal_select_size_details">
                            <summary glot-model="icon_size_details"></summary>
                            <div class="d-flex align-items-center gap-2 mt-1">
                                <label for="modal_select_size" glot-model="icon_size_pixels"></label>
                                <select class="form-select icon-text-size" id="modal_select_size">
                                    <option value="9">9px</option>
                                    <option value="10">10px</option>
                                    <option value="12">12px</option>
                                    <option value="14">14px</option>
                                    <option value="16">16px</option>
                                    <option value="18">18px</option>
                                    <option value="20">20px</option>
                                    <option value="24">24px</option>
                                    <option value="32">32px</option>
                                    <option value="42">42px</option>
                                    <option value="54">54px</option>
                                    <option value="68">68px</option>
                                    <option value="84">84px</option>
                                    <option value="102">102px</option>
                                </select>
                            </div>
                        </details>
                    </div>
                    <div class="icon-selection-actions d-flex gap-2">
                        <button type="button" id="modal_select_all_select" class="btn btn-light"
                            onclick="DataList.filtered_select()"><i class="far fa-check-square" aria-hidden="true"></i> <span glot-model="all_select"></span></button>
                        <button type="button" id="modal_select_all_deselect" class="btn btn-light"
                            onclick="DataList.filtered_deselect()"><i class="far fa-square" aria-hidden="true"></i> <span glot-model="all_deselect"></span></button>
                    </div>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                    <label class="small mb-0" for="modal_select_appearance" glot-model="icon_appearance"></label>
                    <select class="form-select form-select-sm icon-appearance-select" id="modal_select_appearance">
                        <option value="standard" glot-model="icon_appearance_standard"></option>
                        <option value="unframed" glot-model="icon_appearance_unframed"></option>
                        <option value="subtle" glot-model="icon_appearance_subtle"></option>
                    </select>
                </div>
            </div>
            <div class="icon-select-body px-2">
                <table class="table" id="modal_select_table"></table>
            </div>
            </div>
            <div class="icon-select-footer p-2 d-flex flex-wrap gap-2 justify-content-end">
                <div id="modal_select_error" class="alert alert-danger d-none w-100 mb-2" role="alert"
                    aria-live="polite"></div>
                <button class="btn btn-primary" id="modal_select_ok"></button>
                <button class="btn btn-secondary" id="modal_select_cancel"></button>
            </div>
        </div>
    </div>
</div>

    <div class="row g-0 mt-2 overflow-y-scroll" id="customMap">
        <details id="advancedSettings" class="col-12 settings-group">
            <summary glot-model="settings_advanced">詳細設定</summary>
            <div class="col-12">
                <div class="map-style-controls">
                    <div class="map-style-row">
                        <label for="birdseyeEnabled" glot-model="birdseye_display">3D表示</label>
                        <div class="form-check form-switch m-0">
                            <input type="checkbox" class="form-check-input" role="switch" id="birdseyeEnabled" onchange="Birdseye.setEnabled(this.checked)">
                        </div>
                    </div>
                </div>
            </div>
            <div class="rough-controls d-none" id="roughControls">
                <div class="map-style-controls">
                    <div class="map-style-row rough-controls-toggle">
                        <label id="roughSettingsButton" for="rough_fill_style" glot-model="rough_style"></label>
                        <input type="checkbox" id="rough_enabled" hidden>
                        <div class="rough-style-actions">
                            <select class="form-select form-select-sm w-auto rough-fill-select" id="rough_fill_style" aria-labelledby="roughSettingsButton" onchange="RoughStylePanel.selectFill()">
                                <option value="none" glot-model="rough_fill_none" selected>なし</option>
                                <option value="solid" glot-model="rough_fill_solid">ベタ塗り</option>
                                <option value="hachure" glot-model="rough_fill_hachure">斜線</option>
                                <option value="zigzag" glot-model="rough_fill_zigzag">ジグザグ</option>
                                <option value="cross-hatch" glot-model="rough_fill_cross_hatch">格子</option>
                                <option value="dots" glot-model="rough_fill_dots">点</option>
                                <option value="dashed" glot-model="rough_fill_dashed">破線</option>
                                <option value="zigzag-line" glot-model="rough_fill_zigzag_line">ジグザグ線</option>
                            </select>
                            <button type="button" id="roughDetailsButton" class="btn btn-outline-primary btn-sm" glot-model="rough_details" aria-haspopup="dialog" aria-expanded="false" onclick="RoughStylePanel.open()" disabled>詳細</button>
                        </div>
                    </div>
                    <div id="roughParameters" class="d-none">
                        <div class="px-2 py-1 border-bottom">
                            <div class="d-flex justify-content-between">
                                <label for="roughness" glot-model="rough_roughness"></label>
                                <output id="roughness_value" for="roughness">1.0</output>
                            </div>
                            <input class="form-range rough-range" type="range" id="roughness" min="0" max="10" step="0.1" value="1" oninput="mapMaker.rough_change(1000)" disabled>
                        </div>
                        <div class="px-2 py-1 border-bottom">
                            <div class="d-flex justify-content-between">
                                <label for="bowing" glot-model="rough_bowing"></label>
                                <output id="bowing_value" for="bowing">1.0</output>
                            </div>
                            <input class="form-range rough-range" type="range" id="bowing" min="0" max="10" step="0.1" value="1" oninput="mapMaker.rough_change(1000)" disabled>
                        </div>
                    </div>
                    <div class="map-style-row">
                        <label for="mapSeason" class="text-nowrap" glot-model="map_season">季節</label>
                        <select id="mapSeason" class="form-select form-select-sm w-auto" onchange="mapMaker.season_change(this.value)">
                            <option value="normal" glot-model="season_normal" selected>通常</option>
                            <option value="spring" glot-model="season_spring">春</option>
                            <option value="autumn" glot-model="season_autumn">秋</option>
                        </select>
                    </div>
                </div>
            </div>
        </details>
        <h3 class="settings-layer-heading" glot-model="settings_features">地物の調整</h3>
        <fieldset id="AAA" class="d-none">
            <div class="col border-0 border-bottom">
                <div class="layer-control-row align-items-center">
                    <span class="layer-control-label"></span>
                    <button id="AAA_layer" class="del_button me-1">
                        <i class="fas fa-eye me-1"></i></button>
                    <input type="button" id="AAA_color">
                    <input type="button" id="AAA_line" class="line_text" aria-haspopup="dialog" aria-expanded="false">
                </div>
        </fieldset>
    </div>

</div>
