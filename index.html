<body ontouchstart="">

    <div id="exportProcessing" class="export-processing d-none" role="status" aria-live="assertive" aria-busy="true">
        <div class="export-processing-message">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            <span glot-model="export_processing">ダウンロードデータを作成中です。しばらくお待ちください。</span>
        </div>
    </div>

    <div class="d-flex flex-column app-viewport">
        <!-- タイトルメニュー（固定） -->
        <header class="border-bottom">
            <div class="row g-0 align-items-center">
                <div class="col-7 p-0 h-100">
                    <div class="d-flex">
                        <a class="title title d-flex align-items-center text-decoration-none" href="javascript:mapMaker.licence()">
                            <img src="image/mapmaker.svg" class="ms-1" style="height:36px" />
                            <span class="title" glot-model="title"></span>
                            <span class="subtitle" glot-model="subtitle"></span>
                            <span class="subtitle" glot-model="licence"></span>
                        </a>
                    </div>
                    <div>
                    </div>
                </div>
                <div class="col-5 p-0 pe-1 d-flex flex-row-reverse h-100 align-items-center">
                    <button type="button" class="btn btn-sm float-right menu ms-2" data-bs-toggle="dropdown" aria-expanded="true">
                        <i class="fas fa-bars fa"></i></button>
                    <div class="dropdown-menu dropdown-menu-end" style="z-index: 1020;" id="temp_menu">
                        <a class="dropdown-item"><span></span></a>
                        <span class="dropdown-item"></span>
                        <div class="dropdown-divider"></div>
                    </div>
                    <button class='btn btn-light ps-2 pe-2 pt-1 pb-1 text-nowrap' onclick='mapMaker.searchPoi(search_input.value)'></button>
                    <input type='search' id='search_input' class='form-control w-75 h-75 me-2'></input>
                </div>
            </div>
        </header>

        <div class="flex-fill d-flex flex-column flex-lg-row" id="editbar">
            <section class="pane-menu" id="basemenu"></section>
            <section class="flex-fill">
                <article id="article">
                    <div id="mapid"></div>
                    <aside id="roughPreviewWindow" class="rough-preview-window d-none" aria-live="polite">
                        <div id="roughPreviewStatus" class="rough-preview-status d-none"></div>
                        <div id="roughPreview" class="rough-preview"></div>
                    </aside>
                </article>
            </section>
        </div>
    </div>

    <div id="modals"></div>
    <div id="colors"></div>
</body>
