<body ontouchstart="">

    <div id="processingDialog" class="processing-overlay d-none" role="status" aria-live="assertive" aria-busy="false">
        <div class="processing-overlay-message">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            <span id="processingDialogMessage" glot-model="export_processing">ダウンロードデータを作成中です。しばらくお待ちください。</span>
        </div>
    </div>

    <div class="d-flex flex-column app-viewport">
        <!-- タイトルメニュー（固定） -->
        <header class="border-bottom">
            <div class="row g-0 align-items-center">
                <div class="app-header-brand p-0 h-100">
                    <div class="d-flex align-items-center">
                        <div class="dropdown app-main-menu">
                            <button type="button" class="btn btn-light btn-sm menu" data-bs-toggle="dropdown"
                                aria-expanded="false" aria-controls="temp_menu" aria-label="メニュー">
                                <i class="fas fa-bars fa"></i></button>
                            <div class="dropdown-menu" style="z-index: 1020;" id="temp_menu">
                                <a class="dropdown-item"><span></span></a>
                                <span class="dropdown-item"></span>
                                <div class="dropdown-divider"></div>
                            </div>
                        </div>
                        <a class="title title d-flex align-items-center text-decoration-none"
                            href="javascript:mapMaker.licence()">
                            <img src="image/mapmaker.svg" class="ms-1" style="height:32px" />
                            <span class="title" glot-model="title"></span>
                            <span class="subtitle" glot-model="subtitle"></span>
                            <span class="subtitle" glot-model="licence"></span>
                        </a>
                    </div>
                    <div>
                    </div>
                </div>
                <div class="app-header-tools pe-1 d-flex h-100 align-items-center">
                    <div class="dropdown">
                        <button type="button" id="languageMenuButton" class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" aria-controls="languageMenu">
                            <i class="fas fa-globe" aria-hidden="true"></i> <span>日本語</span>
                        </button>
                        <div id="languageMenu" class="dropdown-menu dropdown-menu-end" aria-labelledby="languageMenuButton"></div>
                    </div>
                    <button type="button" id="addressSearchButton" class="btn btn-light address-search-button" data-bs-toggle="modal" data-bs-target="#addressSearchDialog">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-fill d-flex flex-column flex-lg-row" id="editbar">
            <section class="pane-menu" id="basemenu"></section>
            <section class="flex-fill">
                <article id="article">
                    <div id="mapid"></div>
                    <section id="mapMakerIntro" class="mapmaker-intro" aria-labelledby="mapMakerIntroTitle" hidden>
                        <div class="mapmaker-intro__body">
                            <h2 id="mapMakerIntroTitle" glot-model="intro_title"></h2>
                            <p glot-model="intro_message"></p>
                        </div>
                        <button id="mapMakerIntroClose" class="mapmaker-intro__close" type="button"
                            aria-label="案内を閉じる">&times;</button>
                    </section>
                </article>
            </section>
        </div>
    </div>

    <div id="modals"></div>
    <div id="colors"></div>
