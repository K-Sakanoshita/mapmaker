<body ontouchstart="">

    <div id="exportProcessing" class="export-processing d-none" role="status" aria-live="assertive" aria-busy="true">
        <div class="export-processing-message">
            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
            <span glot-model="export_processing">Preparing the download. Please wait.</span>
        </div>
    </div>

    <div class="d-flex flex-column app-viewport">
        <!-- Fixed title menu -->
        <header class="border-bottom">
            <div class="row g-0 align-items-center">
                <div class="col-6 col-lg-7 p-0 h-100">
                    <div class="d-flex">
                        <a class="title title d-flex align-items-center text-decoration-none"
                            href="javascript:mapMaker.licence()">
                            <img src="image/mapmaker.svg" class="ms-1" style="height:36px" />
                            <span class="title" glot-model="title"></span>
                            <span class="subtitle" glot-model="subtitle"></span>
                            <span class="subtitle" glot-model="licence"></span>
                        </a>
                    </div>
                    <div>
                    </div>
                </div>
                <div class="col-6 col-lg-5 p-0 pe-1 d-flex flex-row-reverse h-100 align-items-center">
                    <button type="button" class="btn btn-sm float-right menu ms-2" data-bs-toggle="dropdown"
                        aria-expanded="true">
                        <i class="fas fa-bars fa"></i></button>
                    <div class="dropdown-menu dropdown-menu-end" style="z-index: 1020;" id="temp_menu">
                        <a class="dropdown-item"><span></span></a>
                        <span class="dropdown-item"></span>
                        <div class="dropdown-divider"></div>
                    </div>
                    <button type="button" class="btn btn-light address-search-button"
                        onclick="mapMaker.searchPoi(search_input.value)">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>
                    <input type='search' id='search_input' class='form-control flex-grow-1 h-75 me-2'></input>
                </div>
            </div>
        </header>

        <div class="flex-fill d-flex flex-column flex-lg-row" id="editbar">
            <section class="pane-menu" id="basemenu"></section>
            <section class="flex-fill">
                <article id="article">
                    <div id="mapid"></div>
                    <section id="mapMakerIntro" class="mapmaker-intro" aria-labelledby="mapMakerIntroTitle" hidden>
                        <div class="mapmaker-intro__body">
                            <h2 id="mapMakerIntroTitle" glot-model="intro_title"></h2>
                            <p glot-model="intro_message"></p>
                        </div>
                        <button id="mapMakerIntroClose" class="mapmaker-intro__close" type="button"
                            aria-label="Close introduction">&times;</button>
                    </section>
                </article>
            </section>
        </div>
    </div>

    <div id="modals"></div>
    <div id="colors"></div>
</body>
